[Language_en]
Name=01 Barrier at Addu Atoll
Description=War has reached the Indian Ocean. A Soviet raider group with replenishment support is pushing into the sea lanes south of the Maldives. Sortie from the Addu/Diego Garcia axis, locate the enemy, and destroy the raider group before it can threaten coalition shipping in this introductory fleet engagement.
MissionBriefingGenerateMapFromSymbols=True
MissionBriefingAssetsDirectory=campaigns\southern-sentinel-85\missions\01 Barrier at Addu Atoll_briefing
MissionBriefingLeftPane=campaigns\southern-sentinel-85\missions\01 Barrier at Addu Atoll_briefing\BriefingText_en.xml
MapSymbol_New1Label_en=Enemy Approach Axis
MapSymbol_New2Label_en=Probable Replenishment Track
MapSymbol_New3Label_en=Soviet Surface Raider Group
MapSymbol_New4Label_en=Support Tanker / Auxiliary
MapSymbol_New5Label_en=Addu Atoll
MapSymbol_New6Label_en=Diego Garcia Axis
MapSymbol_New7Label_en=Barrier Patrol Area
Taskforce1Aircraft1NameOverride=P-3C Detachment 'Trident'
Taskforce1Aircraft1ShortNameOverride=Trident
Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Part 1</size>\nBARRIER AT ADDU ATOLL\n<size=24>June 28th, 1985</size>\nBody=Coalition command has identified a Soviet raider detachment entering the central Indian Ocean under cover of maritime reconnaissance. A replenishment ship is believed to be trailing the group. Sortie south of Addu Atoll, establish the barrier, and destroy the enemy force before it can range against the shipping lanes.\n\nAssign your task force P-3C detachment to extend search coverage ahead of the surface group. Expect Soviet long-range air reconnaissance and at least one surface escort screen.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR ADDU ATOLL OPERATING AREA\nVALID: 281900Z-290100Z JUN 85\nModerate seas at Sea State 3 prevail south of the Maldives with broken cloud layers and good long-range visibility over open water. Local squalls may briefly reduce visibility, but overall conditions favor surface search, maritime patrol, and long-range missile employment.
Taskforce1FlagshipmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk!\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1Enemyraidergroupdestroyed-playervictoryMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=DIEGO GARCIA\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Reconnaissance confirms the Soviet raider group has been destroyed or scattered south of the Maldives.\n\n2. (S) The threat to coalition traffic on this axis has been blunted and command assesses the enemy must now regroup before resuming offensive operations.\n\n3. (S) Well done. Recover if required, reform the force, and stand by for convoy defense tasking to the northeast.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyRaiderGroup=Destroy the Soviet raider group
Objective_DestroySupportShip=Destroy the Soviet support tanker or auxiliary
Objective_FlagshipMustSurvive={FlagshipName} must survive

