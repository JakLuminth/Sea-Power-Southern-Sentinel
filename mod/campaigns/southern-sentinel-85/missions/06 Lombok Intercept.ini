Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Part 4</size>\nLOMBOK INTERCEPT\n<size=24>July 12th, 1985</size>\nBody=The enemy is attempting a major breakout through Lombok Strait toward the convoy lanes serving northwest Australia. Use your task force reconnaissance aircraft to track the breakout axis, then intercept the Soviet surface group and destroy it before it reaches open water.\n\nRadio intercepts suggest at least one Kilo class submarine is operating north of the narrows.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR LOMBOK STRAIT\nVALID: 120100Z-120900Z JUL 85\nMonsoon flow through Lombok Strait remains steady with Sea State 3, broken cloud, and generally good visibility. Local channel winds may produce brief maneuvering difficulties near the island shoulders.
Taskforce1FlagshipdestroyedMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk before the breakout could be stopped.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1DatumA01reportMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=ASW WATCH\nSubj=CONTACT REPORT-KILO DATUM A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Radio intercepts and acoustic intelligence indicate one KILO class submarine moving into Lombok Strait from the north.\n\n2. (S) Datum A01 is marked on your chart. Destroy the contact if encountered.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Taskforce1BreakoutgroupdestroyedMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=DARWIN\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) The Soviet breakout force in Lombok Strait has been destroyed.\n\n2. (S) Enemy pressure on the eastern convoy lanes is assessed as sharply reduced.\n\n3. (S) Reform for convoy defense south of Timor.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyBreakoutGroup=Destroy the Soviet breakout group
Objective_DestroyEnemySub=Destroy any enemy submarine encountered
Objective_FlagshipMustSurvive={FlagshipName} must survive
