Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Air Strike</size>\nHAMMER FROM LEARMONTH\n<size=24>July 15th, 1985</size>\nBody=RAAF F-111Cs from Learmonth will conduct a detached long-range strike against Soviet support shipping beyond the choke points. Destroy the two logistics ships and withdraw before Soviet air or surface units can recover.\n\nThis strike is intended to weaken the enemy's ability to sustain eastern operations.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR NORTHWEST SHELF STRIKE AREA\nVALID: 150600Z-151400Z JUL 85\nDry season conditions over northwest Australia and the Timor approaches favor long-range navigation and strike operations. High cloud and isolated haze banks may complicate visual target identification, but overall weather is suitable for stand-off attack profiles.
Taskforce1StrikepackagelostMessage=Title=MISSION FAILED\nBody=Defeat! The strike package has been lost before completing its attack.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1Targetsdestroyed-playervictoryMessage=From=JOINT AIR HQ\nTo=LEARMONTH STRIKE PACKAGE\nInfo=WESTERN AIR COMMAND\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Battle damage assessment confirms both Soviet logistics ships have been destroyed or left burning.\n\n2. (S) Enemy eastern naval operations will face immediate logistics disruption.\n\n3. (S) Recover and prepare for follow-on alert status.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyAnchorage=Destroy the two Soviet logistics ships
Objective_StrikePackageMustSurvive=At least one F-111C must survive
