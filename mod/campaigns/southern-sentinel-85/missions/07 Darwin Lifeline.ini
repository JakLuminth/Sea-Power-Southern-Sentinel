Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Part 5</size>\nDARWIN LIFELINE\n<size=24>July 18th, 1985</size>\nBody=Enemy forces are making one last hard push at the reinforcement routes feeding Darwin. Your task force must hold the line, use assigned reconnaissance aircraft to maintain contact, protect the convoy, and preserve the coalition foothold in northern Australia.\n\nExpect coordinated surface pressure, long-range reconnaissance, and submarine interference in the Timor Sea approaches.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR DARWIN APPROACHES\nVALID: 180500Z-181700Z JUL 85\nDry season weather over the Timor Sea favors long-range detection. Sea State 2 to 3, scattered cloud, and good visibility will benefit both convoy defense and hostile reconnaissance. Isolated haze banks may reduce visibility near dawn.
Taskforce1FlagshipdestroyedMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk and convoy defense has collapsed.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ConvoylostMessage=Title=MISSION FAILED\nBody=Defeat! Darwin's reinforcement convoy has suffered unacceptable losses.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ConvoyreachessafeareaMessage=1. (S) The Darwin reinforcement convoy has reached protected waters under escort.\n\n2. (S) Enemy eastern thrust units have been broken up and the theater lodgement in northern Australia remains intact.\n\n3. (S) If HMAS Perth survives Darwin Lifeline, Darwin Defense Command will assign her to {TaskForceName} as an additional escort for follow-on operations.\n\n4. (S) Prepare your force for a final surface sweep toward the Nicobar axis.
Objective_DefendConvoy=Defend the Darwin convoy
Objective_DestroyMainThrust=Destroy the enemy main thrust group
Objective_FlagshipMustSurvive={FlagshipName} must survive
