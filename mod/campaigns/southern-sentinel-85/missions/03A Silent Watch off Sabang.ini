
[Language_en]
Name=03A Silent Watch off Sabang
Description=Slip into the Sabang approaches, strike a Soviet support ship under escort, and escape before the area closes around your boat.
MapSymbol_New1Label_en=Sabang Approaches
MapSymbol_New2Label_en=Support Ship Anchorage
MapSymbol_New3Label_en=Escape Area
