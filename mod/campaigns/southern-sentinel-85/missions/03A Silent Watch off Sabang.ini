Trigger3Condition_Condition1AreaLabel=Escape area
Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Sub Challenge</size>\nSILENT WATCH OFF SABANG\n<size=24>July 5th, 1985</size>\nBody=A Soviet support ship has anchored west of Sabang to refuel and rearm units screening the Sunda approaches. Infiltrate the anchorage, sink the support ship, and escape to the southwest before the patrol screen converges.\n\nThis mission depends on stealth and timing. Do not linger after attack.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR SABANG APPROACHES\nVALID: 050200Z-050900Z JUL 85\nNight operations west of Sabang will take place in light winds, Sea State 2 to 3, and humid haze with scattered showers. Surface visibility will vary sharply around rain cells, favoring a submerged approach.
Taskforce1SubmarinelostMessage=Title=MISSION FAILED\nBody=Defeat! Your submarine has been lost off Sabang.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1EscapeafterstrikeMessage=From=COMSUBIO\nTo={SelectedUnitName}\nInfo=INDIAN OCEAN COMMAND\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Reconnaissance confirms the Soviet support ship off Sabang has been sunk.\n\n2. (S) Enemy screen units in the Sunda approaches will face temporary fuel and ammunition disruption.\n\n3. (S) Withdraw to deep water and await further orders.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1DestroysupportshipMessage=Title=MISSION UPDATE\nBody=Target support ship destroyed. Escape south-west immediately.\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Objective_DestroySupportShip=Destroy the Soviet support ship
Objective_SubMustSurvive={SelectedUnitName} must survive
