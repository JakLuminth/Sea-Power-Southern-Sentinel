Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Part 2</size>\nEIGHT DEGREE ESCORT\n<size=24>June 30th, 1985</size>\nBody=Coalition routing control has compressed merchant traffic into the Eight Degree Channel. A Soviet surface interception group supported by submarine patrols is moving to sever the route.\n\nUse your assigned task force reconnaissance aircraft to sanitize the channel approaches, then screen the convoy through the channel and ensure the merchants reach the eastern exit intact.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR EIGHT DEGREE CHANNEL\nVALID: 300400Z-301200Z JUN 85\nModerate southwest monsoon conditions prevail in the channel. Sea State 3 to 4, scattered squalls, and long patches of haze will complicate visual search but should not materially hinder radar and helicopter ASW operations.
Taskforce1FlagshipdestroyedMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk and the convoy screen has collapsed.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ConvoylostMessage=Title=MISSION FAILED\nBody=Defeat! The escorted merchant convoy has been destroyed or scattered in the Eight Degree Channel.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ConvoyclearofchannelMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=DIEGO GARCIA\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Coalition routing control confirms the convoy has cleared the Eight Degree Channel under escort.\n\n2. (S) The Soviet interception attempt failed, preserving the central Indian Ocean convoy artery for follow-on operations.\n\n3. (S) Reform the force and prepare for detached eastern operations.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1SubmarinedatumMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=ASW WATCH\nSubj=CONTACT REPORT-DATUM A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Merchant HF intercepts and sonobuoy returns suggest a Soviet diesel submarine shadowing the convoy from the west.\n\n2. (S) Datum A01 has been marked on your chart. Investigate and prosecute as required.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Objective_EscortConvoy=Escort both merchant ships through the channel
Objective_DestroyInterceptors=Destroy the Soviet interception group
Objective_FlagshipMustSurvive={FlagshipName} must survive
