
[Language_en]
Name=07A Northern Shield from Darwin
Description=Direct air operations from Darwin to support a coalition surface screen in the Timor Sea. Use Darwin-based fighter and patrol aircraft, including F-4Es with limited strike capability, to disrupt Soviet raiding forces and keep the escort line intact.
MapSymbol_New1Label_en=Darwin Air Base
MapSymbol_New2Label_en=Coalition Support Screen
MapSymbol_New3Label_en=Soviet Raider Axis
MapSymbol_New5Label_en=Support Hold Area
MissionBriefingGenerateMapFromSymbols=True
