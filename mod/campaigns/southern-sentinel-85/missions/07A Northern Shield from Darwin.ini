MissionBriefingLeftPane=campaigns\southern-sentinel-85\missions\07A Northern Shield from Darwin_briefing\BriefingText_en.xml
Taskforce1LandUnit1NameOverride=Darwin Air Base
Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Airbase Support</size>\nNORTHERN SHIELD FROM DARWIN\n<size=24>July 19th, 1985</size>\nBody=With the convoy corridor reopened, Darwin-based air elements are tasked to support a coalition escort screen holding the Timor Sea approaches. Fighter and patrol sorties from the airbase will pressure the Soviet raider force, disrupt hostile air activity, and maintain surveillance over the escort line.\n\nAustralian fighter and patrol aircraft are assigned to keep hostile shipping and aircraft under pressure while protecting the surface screen.\n\nYour surface screen is outnumbered and depends on timely air cover and reconnaissance.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR DARWIN SUPPORT CORRIDOR\nVALID: 190530Z-191330Z JUL 85\nDry-season visibility remains favorable over the Timor Sea with Sea State 2 to 3 and scattered cloud decks. Conditions support long-range radar surveillance and coordinated fighter and patrol operations from Darwin.
Taskforce1SupportfleetlostMessage=Title=MISSION FAILED\nBody=Defeat! The coalition support screen has been destroyed.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1RaidersdestroyedMessage=From=JOINT MARITIME HQ\nTo=DARWIN AIR CONTROL\nInfo=EASTERN COMMAND\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Darwin-directed fighter and patrol support has broken up the Soviet raider detachment in the Timor approaches.\n\n2. (S) Coalition escort forces remain on station and sea-lane traffic can continue under cover.\n\n3. (S) Maintain alert posture for follow-on fleet operations to the northwest.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyRaiders=Destroy the Soviet raider detachment
Objective_SupportFleetSurvives=Coalition support screen must survive
