[Language_en]
Name=Southern Sentinel '85 (NATO - Task Force Mode)
Description=Southern Sentinel '85 is a linear Task Force Mode campaign set across the Indian Ocean at the outbreak of global war in 1985. Command a U.S.-led coalition naval force as it protects convoys, contests the Sunda and Lombok choke points, supports detached submarine and strike missions, and ultimately destroys the last Soviet raider force threatening the southern sea lanes.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: This is a Task Force Mode campaign. Build and customize a persistent task force, then deploy it across campaign missions. Ship and aircraft losses, battle damage, and weapon expenditures will carry forward from one mission to the next.

