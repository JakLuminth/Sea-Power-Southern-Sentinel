Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Final Action</size>\nLAST LIGHT OFF NICOBAR\n<size=24>July 22nd, 1985</size>\nBody=Coalition sea control is within reach, but a final Soviet raider concentration still threatens the approaches to Malacca from the Nicobar Basin. Use your task force reconnaissance aircraft to pin down the enemy axis, then close with the enemy and destroy the force before it can scatter back into the trade routes.\n\nThis is the culminating surface action of the campaign. Commit the strongest survivors and finish the threat.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR NICOBAR BASIN\nVALID: 221100Z-222100Z JUL 85\nOpen-ocean conditions northwest of the Nicobars remain favorable for long-range radar and missile combat. Sea State 3, broken cloud, and occasional high haze will permit wide-area search with only minor visual limitations.
Taskforce1FlagshipdestroyedMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk before the final raider force could be destroyed.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1FinalraiderforcedestroyedMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=INDIAN OCEAN COMMAND\nSubj=FINAL MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Reconnaissance confirms the final Soviet raider concentration in the Nicobar Basin has been destroyed.\n\n2. (S) The southern and eastern approaches to Malacca are now secure for coalition shipping.\n\n3. (S) Outstanding work. Southern Sentinel has accomplished its campaign objectives.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyFinalRaiders=Destroy the final Soviet raider force
Objective_FlagshipMustSurvive={FlagshipName} must survive
