Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Side Operation</size>\nLIFELINE SOUTH\n<size=24>July 14th, 1985</size>\nBody=With enemy pressure building east of Lombok, coalition auxiliaries and merchants are withdrawing toward northwest Australia under emergency routing. Use your task force reconnaissance aircraft to clear the approach, then escort the convoy south and destroy or drive off raiders.\n\nYou may face submarine or air shadowing as the convoy clears the Timor Sea approaches.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR NORTHWEST AUSTRALIA ROUTE\nVALID: 140600Z-141800Z JUL 85\nDry season conditions prevail with long-range visibility, Sea State 2 to 3, and only isolated cloud. The favorable weather increases detection ranges for both convoy escorts and hostile reconnaissance.
Taskforce1FlagshipdestroyedMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk and convoy command has been lost.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ConvoylostMessage=Title=MISSION FAILED\nBody=Defeat! The withdrawing convoy has suffered unacceptable losses.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1ConvoysafeMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=DARWIN\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Coalition auxiliaries and merchant shipping have reached the northwest Australia corridor under escort.\n\n2. (S) The withdrawal has preserved critical fuel and cargo for Darwin's continued defense.\n\n3. (S) If HMAS Canberra survives Lifeline South, RAN will assign her to your command as a temporary reinforcement for follow-on operations.\n\n4. (S) Rejoin the main effort as soon as practical.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
