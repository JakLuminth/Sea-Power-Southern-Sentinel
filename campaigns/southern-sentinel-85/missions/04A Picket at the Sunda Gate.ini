
[Language_en]
Name=04A Picket at the Sunda Gate
Description=Detach a single escort to hold the Sunda approaches long enough for allied shipping to clear south. This is a high-risk single-ship challenge: survive, delay the raiders, and get the withdrawal traffic through the exit lane.
MapSymbol_New1Label_en=Sunda Strait
MapSymbol_New6Label_en=Sunda Exit
MapSymbol_New7Label_en=Datum A01
MissionBriefingGenerateMapFromSymbols=True
