Trigger4Condition_Condition1AreaLabel=Sunda Exit Lane
Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Ship Challenge</size>\nPICKET AT THE SUNDA GATE\n<size=24>July 10th, 1985</size>\nBody={SelectedUnitName} has been detached from the main force to hold the Sunda approaches long enough for coalition traffic to clear south. A Soviet-led raider group is moving through the strait under submarine cover.\n\nYour priority is to delay the raiders, cover the withdrawal traffic, and survive to rejoin the main effort. Prosecute the submarine if the tactical situation permits.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR SUNDA STRAIT\nVALID: 100100Z-100700Z JUL 85\nNight conditions in Sunda Strait remain favorable for radar action with Sea State 3, scattered cloud, and localized haze near the coasts. Current shear in the narrows may complicate maneuvering at high speed.
Taskforce1SelectedunitmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! {SelectedUnitName} has been sunk.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1DatumA01messageMessage=From=JOINT MARITIME HQ\nTo=CO {SelectedUnitName}\nInfo=ASW WATCH\nSubj=CONTACT REPORT-KILO DATUM A01\nPrecedence=Flash\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Radio intercepts indicate one KILO class submarine moving into Sunda Strait from the north.\n\n2. (S) Datum A01 is marked on your chart. Destroy the contact if the tactical situation permits.\nButtonText=Acknowledge & continue\nPopupStyle=NavalMessage
Taskforce1WithdrawaltrafficclearMessage=From=JOINT MARITIME HQ\nTo=CO {SelectedUnitName}\nInfo=EASTERN COMMAND\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Coalition withdrawal traffic has cleared Sunda Strait under your cover.\n\n2. (S) The enemy raider detachment has been delayed long enough for follow-on operations toward Lombok to continue.\n\n3. (S) Rejoin the task force when able. Excellent work under detached command.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Taskforce1WithdrawaltrafficlostMessage=Title=MISSION FAILED\nBody=Defeat! Too many coalition merchants have been lost before they could clear Sunda Strait.\nButtonText=Continue playing\nPopupStyle=Outro
Objective_ProtectWithdrawalTraffic=Get at least three coalition merchants through the Sunda exit
Objective_DestroyEnemySub=Destroy any enemy submarine encountered
Objective_SelectedUnitMustSurvive={SelectedUnitName} must survive
