Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Part 3</size>\nSUNDA GATE COUNTERSTRIKE\n<size=24>July 8th, 1985</size>\nBody=Enemy screening forces have advanced into the Sunda approaches to deny coalition access east of Sumatra. Push into the strait, destroy the Soviet-led screen, and reopen the gateway for follow-on operations.\n\nExpect missile-armed escorts and fast patrol craft operating close to the Java coast.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST FOR SUNDA STRAIT\nVALID: 080500Z-081200Z JUL 85\nMorning haze and broken cloud are expected over Sunda Strait with Sea State 3 and localized coastal rain. Strong currents in the narrows will complicate maneuvering near the island shoulders.
Taskforce1FlagshipdestroyedMessage=Title=MISSION FAILED\nBody=Defeat! {FlagshipName} has been sunk before the strait could be cleared.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1EnemyscreendestroyedMessage=From=JOINT MARITIME HQ\nTo={TaskForceName}\nInfo=EASTERN COMMAND\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Reconnaissance confirms the enemy screening force in Sunda Strait has been destroyed or driven off.\n\n2. (S) The strait is open for coalition movement and pressure can now shift toward Lombok.\n\n3. (S) Recover and prepare to press east.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroyScreen=Destroy the enemy screen line
Objective_FlagshipMustSurvive={FlagshipName} must survive
