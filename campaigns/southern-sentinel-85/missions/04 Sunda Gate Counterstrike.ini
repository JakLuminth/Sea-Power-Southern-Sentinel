
[Language_en]
Name=03 Sunda Gate Counterstrike
Description=Enemy light and medium forces are screening the Sunda exit. Break the screen and reopen the gateway into the archipelago for coalition operations.
MapSymbol_New1Label_en=Sunda Strait
MapSymbol_New2Label_en=Enemy Screen Line
MissionBriefingGenerateMapFromSymbols=True
MissionBriefingAssetsDirectory=campaigns\southern-sentinel-85\missions\04 Sunda Gate Counterstrike_briefing
