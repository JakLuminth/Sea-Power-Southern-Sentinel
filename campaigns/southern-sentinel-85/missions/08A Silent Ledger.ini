[Language_en]
Name=08A Silent Ledger
Description=A detached submarine will patrol west of Sumatra to identify and, if possible, destroy Soviet replenishment traffic feeding eastern raider operations. Expect a focused patrol with light escort opposition.
MissionBriefingGenerateMapFromSymbols=True
MissionBriefingAssetsDirectory=campaigns\southern-sentinel-85\missions\08A Silent Ledger_briefing
MissionBriefingLeftPane=campaigns\southern-sentinel-85\missions\08A Silent Ledger_briefing\BriefingText_en.xml
MapSymbol_New1Label_en=Patrol Box West of Sumatra
MapSymbol_New2Label_en=Probable Soviet Replenishment Route
MapSymbol_New3Label_en=Escape Area
MapSymbol_New4Label_en=Sabang Approaches
Trigger3Condition_Condition1AreaLabel=Escape area
Taskforce1StartMessage=Title=<size=24>Southern Sentinel '85 - Sub Patrol</size>\nSILENT LEDGER\n<size=24>July 9th, 1985</size>\nBody=Signals intelligence indicates Soviet replenishment traffic is moving west of Sumatra to support operations around Sunda and Lombok. Your submarine is to infiltrate the patrol box, classify the contact, and destroy it if the tactical picture permits.\n\nOnce the strike is complete, break contact and exit to the southwest. Preserve the boat for follow-on operations.\nButtonText=Start mission\nPopupStyle=Intro
StartForecast=FLEET WEATHER FORECAST WEST OF SUMATRA\nVALID: 090900Z-091700Z JUL 85\nEquatorial haze and layered cloud persist west of Sumatra. Sea State 3 with localized rain showers. Conditions favor submerged approach and radar interception of surface contacts remains unreliable near squalls.
Taskforce1SubmustsurviveMessage=Title=MISSION FAILED\nBody=Defeat! Your submarine has been lost west of Sumatra.\nButtonText=Continue playing\nPopupStyle=Outro
Taskforce1TargetdestroyedMessage=Title=MISSION UPDATE\nBody=Target support shipping destroyed. Disengage and proceed to the escape area.\nButtonText=Acknowledge & continue\nPopupStyle=Notification
Taskforce1Escape-playervictoryMessage=From=COMSUBIO\nTo={SelectedUnitName}\nInfo=INDIAN OCEAN COMMAND\nSubj=MISSION ACCOMPLISHED\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Battle damage assessment confirms Soviet replenishment traffic on this route has been interrupted.\n\n2. (S) Enemy eastern surface operations are expected to face immediate endurance constraints.\n\n3. (S) Remain covert and proceed to ordered rendezvous.\nButtonText=Continue playing\nPopupStyle=NavalMessage\nMessageRole=Outro
Objective_DestroySupportShip=Destroy the Soviet replenishment ship
Objective_SubMustSurvive={SelectedUnitName} must survive

